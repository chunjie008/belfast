# Include this file from the top-level nginx context, not inside http {}.
# Belfast and the gateway keep listening on loopback-only backend ports.

upstream belfast_gateway {
    server 127.0.0.1:8080;
}

upstream belfast_game {
    server 127.0.0.1:7000;
}

server {
    listen 80;
    proxy_pass belfast_gateway;
    proxy_connect_timeout 5s;
    proxy_timeout 1h;
}

server {
    listen 20000;
    proxy_pass belfast_game;
    proxy_connect_timeout 5s;
    proxy_timeout 1h;
}
